# Fictional demo policy; NOT actual statutory or merchant policy.
store: demo-vn
version: POL-2026-001
status: PUBLISHED
effective_from: '2026-01-01T00:00:00+07:00'
effective_to: null
currency: VND
business_timezone: Asia/Ho_Chi_Minh
version_binding: ORDER_PURCHASE_DATE
return_rules:
  ordinary_return:
    rule_ids: [R-001, R-002, R-003, R-004]
    reasons: [changed_mind]
    allowed_item_categories: [standard]
    allowed_order_item_statuses: [DELIVERED]
    max_days_after_delivery_inclusive: 14
