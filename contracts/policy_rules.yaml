    on_out_of_window: MANUAL_REVIEW
    on_missing_evidence: MISSING_INFO
refund_rules:
  rule_ids: [R-008, R-009, R-010, R-011, R-012, R-013]
  max_proposed_refund_vnd_inclusive: 5000000
  price_source: order_items.paid_amount_vnd
  all_refunds_require_human_approval: true
  human_approval_role: reviewer
  financial_effect: SIMULATED_LEDGER_ONLY
  approval_binds: [return_request_id, order_item_id, policy_version_id, proposed_amount_vnd, proposal_hash]
  issue_requires_status: APPROVED
