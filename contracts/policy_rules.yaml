    required_packaging_intact: true
    excluded_categories: [hygiene, customized, digital, final_sale]
  exception_claim:
    rule_ids: [R-005, R-006, R-007]
    reasons: [damaged, wrong_item]
    max_days_after_delivery_inclusive: 30
    required_evidence_refs_min: 1
    evaluation_priority: [out_of_window, missing_evidence, in_window_with_evidence]
